<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spielplan – verschachteltes Menü</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #292629; background: #f5f0e6; }
    body { max-width: 46rem; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { margin-bottom: 2rem; }
    nav { padding: 1rem; background: #641f32; color: #fff; }
    ul { list-style: none; margin: 0; padding: 0; }
    details { margin: .35rem 0; }
    summary { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1rem; cursor: pointer; list-style: none; border-radius: .25rem; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: ""; width: .55rem; height: .55rem; flex: 0 0 .55rem; border-right: .14rem solid currentColor; border-bottom: .14rem solid currentColor; transform: rotate(45deg); }
    details[open] > summary::after { transform: rotate(225deg); }
    summary:hover, details[open] > summary { background: #812942; }
    .level-2 { margin-left: 1rem; padding-left: .75rem; border-left: 2px solid #b08d57; }
    .level-3 { margin-left: 1rem; padding-left: .75rem; border-left: 2px solid #b08d57; }
    a { display: block; padding: .65rem 1rem; color: inherit; text-decoration: none; }
    a:hover { background: #812942; }
    .assertion { margin-top: 1.5rem; padding: 1rem; background: #fff; border: 2px solid #80633d; }
  </style>
</head>
<body>
  <h1>Verschachteltes Menü: erweiterter Zustand</h1>
  <nav aria-label="Hauptnavigation">
    <ul>
      <li>
        <details open>
          <summary>Spielplan</summary>
          <ul class="level-2">
            <li>
              <details open>
                <summary>Spielzeit 2026/27</summary>
                <ul class="level-3">
                  <li><a href="#oper">Oper</a></li>
                  <li><a href="#konzerte">Konzerte</a></li>
                </ul>
              </details>
            </li>
            <li><a href="#rueckblick">Rückblick</a></li>
          </ul>
        </details>
      </li>
    </ul>
  </nav>
  <p class="assertion"><strong>Prüfung:</strong> „Spielplan“ ist geöffnet. Der Pfeil steht am rechten Rand; die Ebenen „Spielzeit 2026/27“, „Oper“ und „Konzerte“ sind sichtbar.</p>
</body>
</html>
